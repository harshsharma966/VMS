<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart-Cam VMS</title>
    <meta name="description" content="Login to your Smart-Cam account to access your construction camera monitoring dashboard.">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F7983A',
                        'neutral-0': '#FFFFFF',
                        'neutral-100': '#F1F2F6',
                        'neutral-200': '#E5E7EB',
                        'neutral-300': '#D1D5DB',
                        'neutral-500': '#6B7280',
                        'neutral-700': '#374151',
                        'neutral-900': '#111827',
                        'red': '#EF4444',
                        'green': '#10B981',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="font-inter bg-gradient-to-br from-neutral-100 via-white to-orange-50">

    <!-- Login Container -->
    <div class="min-h-screen flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-md">

            <!-- Logo -->
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center space-x-3">
                    <div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center">
                        <i class="ph ph-video-camera text-white text-3xl"></i>
                    </div>
                    <span class="text-3xl font-bold text-neutral-900">Smart-Cam</span>
                </a>
            </div>

            <!-- Login Card -->
            <div class="bg-white rounded-2xl shadow-2xl p-8 lg:p-10">
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-neutral-900 mb-2">Welcome Back</h1>
                    <p class="text-neutral-500">Sign in to access your dashboard</p>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-6">
                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-neutral-900 mb-2">
                            Email Address
                        </label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                            placeholder="you@company.com"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-semibold text-neutral-900 mb-2">
                            Password
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="password"
                                name="password"
                                required
                                class="w-full px-4 py-3 border border-neutral-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all pr-12"
                                placeholder="Enter your password"
                            >
                            <button
                                type="button"
                                id="toggle-password"
                                class="absolute right-4 top-1/2 transform -translate-y-1/2 text-neutral-500 hover:text-neutral-700"
                            >
                                <i class="ph ph-eye text-xl"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input
                                type="checkbox"
                                id="remember"
                                name="remember"
                                class="w-4 h-4 text-primary border-neutral-300 rounded focus:ring-2 focus:ring-primary"
                            >
                            <span class="text-sm text-neutral-700">Remember me</span>
                        </label>
                        <a href="#" class="text-sm text-primary hover:text-orange-600 font-medium">
                            Forgot password?
                        </a>
                    </div>

                    <!-- Submit Button -->
                    <button
                        type="submit"
                        class="w-full bg-primary hover:bg-orange-600 text-white px-8 py-4 rounded-full font-semibold text-lg transition-all shadow-xl shadow-primary/30 hover:shadow-2xl hover:shadow-primary/40"
                    >
                        Sign In
                    </button>

                    <!-- Error Message -->
                    <div id="error-message" class="hidden bg-red/10 border border-red text-red px-6 py-4 rounded-lg">
                        <div class="flex items-center space-x-3">
                            <i class="ph-fill ph-warning-circle text-2xl"></i>
                            <span class="font-medium">Invalid email or password</span>
                        </div>
                    </div>
                </form>

                <!-- Divider -->
                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-neutral-200"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-white text-neutral-500">Or continue with</span>
                    </div>
                </div>

                <!-- Social Login -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center space-x-2 px-4 py-3 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition-colors">
                        <i class="ph-fill ph-google-logo text-xl"></i>
                        <span class="font-medium text-neutral-700">Google</span>
                    </button>
                    <button class="flex items-center justify-center space-x-2 px-4 py-3 border border-neutral-300 rounded-lg hover:bg-neutral-50 transition-colors">
                        <i class="ph-fill ph-microsoft-outlook-logo text-xl"></i>
                        <span class="font-medium text-neutral-700">Microsoft</span>
                    </button>
                </div>

                <!-- Sign Up Link -->
                <p class="text-center text-neutral-500 mt-8">
                    Don't have an account?
                    <a href="register.html" class="text-primary hover:text-orange-600 font-semibold">
                        Sign up for free
                    </a>
                </p>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-8">
                <a href="index.html" class="text-neutral-500 hover:text-primary flex items-center justify-center space-x-2">
                    <i class="ph ph-arrow-left"></i>
                    <span>Back to home</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="js/main.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('toggle-password')?.addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.className = 'ph ph-eye-slash text-xl';
            } else {
                passwordInput.type = 'password';
                icon.className = 'ph ph-eye text-xl';
            }
        });

        // Handle form submission
        document.getElementById('login-form')?.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // TODO: Replace with actual API call
            console.log('Login attempt:', { email, password });

            // Simulate login - redirect to app
            // window.location.href = 'https://app.drishyamvms.com/dashboard';

            // For demo purposes, show error
            // document.getElementById('error-message').classList.remove('hidden');
        });
    </script>
</body>
</html>
